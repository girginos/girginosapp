<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data: pusula-favicon:; base-uri 'none'; form-action 'none'">
<title>Yeni sekme</title>
<style>
  :root {
    --zemin: #f4f6f9; --kart: #fff; --metin: #1c1f26; --metin2: #6b7280;
    --cizgi: #e2e5ea; --vurgu: #2867ff; --vurgu-yumusak: rgba(40,103,255,.10);
    --golge: 0 1px 2px rgba(16,20,30,.06), 0 8px 24px rgba(16,20,30,.05);
    /* Animasyonlu arka plandaki yumuşak renk lekeleri (açık tema). */
    --leke1: rgba(40,103,255,.16); --leke2: rgba(120,80,255,.13); --leke3: rgba(0,180,200,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --zemin: #16181d; --kart: #23262e; --metin: #e8eaee; --metin2: #9aa2b1;
            --cizgi: #333844; --vurgu: #4d8dff; --vurgu-yumusak: rgba(77,141,255,.16);
            --golge: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
            --leke1: rgba(77,141,255,.20); --leke2: rgba(150,110,255,.16); --leke3: rgba(0,200,220,.13); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--zemin); color: var(--metin);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; justify-content: center;
  }

  /*
   * Animasyonlu arka plan: yavaşça yer değiştiren birkaç bulanık renk lekesi.
   * Dikkat dağıtmayan, gizlilik temasına uygun sakin bir hareket; yalnızca CSS
   * (canvas/JS yok). Sabit konumlu ve z-index -1, içeriğin altında kalır,
   * pointer-events yok - tıklamayı engellemez.
   */
  body::before {
    content: ''; position: fixed; inset: -25%;
    z-index: -1; pointer-events: none;
    background:
      radial-gradient(38% 38% at 22% 28%, var(--leke1), transparent 70%),
      radial-gradient(34% 34% at 80% 22%, var(--leke2), transparent 70%),
      radial-gradient(42% 42% at 62% 82%, var(--leke3), transparent 70%);
    filter: blur(64px);
    animation: lekeGez 26s ease-in-out infinite alternate;
  }
  @keyframes lekeGez {
    from { transform: translate(0, 0) scale(1) rotate(0deg); }
    to   { transform: translate(2%, 3%) scale(1.12) rotate(6deg); }
  }
  /* "Hareketi azalt" tercihine saygı: animasyon durur, lekeler sabit kalır. */
  @media (prefers-reduced-motion: reduce) { body::before { animation: none; } }

  main { width: min(900px, 100%); padding: 8vh 24px 48px; position: relative; }

  /* ---- marka + arama ---- */
  .marka { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 22px; }
  .marka svg { width: 38px; height: 38px; color: var(--vurgu); }
  .marka h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
  .marka span { display: block; color: var(--metin2); font-size: 12px; font-weight: 400; letter-spacing: 0; margin-top: 1px; }

  form {
    display: flex; align-items: center; gap: 6px;
    max-width: 620px; margin: 0 auto 40px;
    padding: 6px 6px 6px 4px;
    background: var(--kart);
    border: 1px solid var(--cizgi); border-radius: 30px;
    box-shadow: var(--golge);
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  form:focus-within { border-color: var(--vurgu); box-shadow: var(--golge), 0 0 0 3px var(--vurgu-yumusak); }
  input[type="text"] {
    flex: 1; min-width: 0;
    padding: 12px 16px;
    border: 0; border-radius: 26px;
    background: transparent; color: var(--metin);
    font: inherit; font-size: 15px; outline: none;
  }
  /* Belirgin, yuvarlak arama düğmesi: vurgu renginde, büyüteç ikonlu. */
  button[type="submit"] {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 0 20px 0 16px; height: 42px;
    border: 0; border-radius: 24px;
    background: var(--vurgu); color: #fff;
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: filter .12s ease, transform .12s ease;
  }
  button[type="submit"] svg { width: 17px; height: 17px; }
  button[type="submit"]:hover { filter: brightness(1.08); }
  button[type="submit"]:active { transform: scale(.97); }

  /* ---- bölüm başlıkları ---- */
  h2 {
    margin: 0 0 12px; padding-left: 2px;
    font-size: 11px; font-weight: 600; color: var(--metin2);
    text-transform: uppercase; letter-spacing: .07em;
  }
  section { margin-bottom: 34px; }

  /* ---- sık gidilenler ---- */
  .kutucuklar { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .kutucuk {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    padding: 12px;
    border: 1px solid var(--cizgi); border-radius: 12px;
    background: var(--kart); color: inherit; text-decoration: none;
    transition: border-color .12s ease, transform .12s ease;
  }
  .kutucuk:hover { border-color: var(--vurgu); transform: translateY(-1px); }
  .rozet {
    flex: 0 0 32px; width: 32px; height: 32px;
    display: grid; place-items: center;
    border-radius: 10px; color: #fff;
    font-size: 14px; font-weight: 700; line-height: 1;
  }
  .rozet-img {
    flex: 0 0 32px; width: 32px; height: 32px;
    border-radius: 8px; object-fit: contain;
    background: var(--zemin);
  }
  .kutucuk-metin { min-width: 0; }
  .kutucuk-ad { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kutucuk-alt { color: var(--metin2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .kutucuk .sil {
    position: absolute; top: 4px; right: 4px;
    width: 20px; height: 20px;
    border: 0; border-radius: 50%;
    background: transparent; color: var(--metin2);
    font-size: 14px; line-height: 1; cursor: pointer;
    opacity: 0;
  }
  .kutucuk:hover .sil { opacity: .7; }
  .kutucuk .sil:hover { opacity: 1; color: var(--vurgu); background: var(--vurgu-yumusak); }

  .ekle {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px; min-height: 58px;
    border: 1px dashed var(--cizgi); border-radius: 12px;
    background: transparent; color: var(--metin2);
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .ekle:hover { border-color: var(--vurgu); color: var(--vurgu); }
  #kisayolGirdi {
    width: 100%; padding: 12px;
    border: 1px solid var(--vurgu); border-radius: 12px;
    background: var(--kart); color: var(--metin);
    font: inherit; font-size: 13px; outline: none;
  }

  /* ---- tanıtım / reklam alanı ---- */
  .duyurular { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .duyuru {
    display: block;
    padding: 16px;
    border: 1px solid var(--cizgi); border-radius: 12px;
    background: var(--kart); color: inherit; text-decoration: none;
  }
  a.duyuru:hover { border-color: var(--vurgu); }
  .duyuru-etiket {
    display: inline-block; margin-bottom: 8px;
    padding: 2px 8px; border-radius: 20px;
    background: var(--vurgu-yumusak); color: var(--vurgu);
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
  }
  .duyuru-baslik { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .duyuru-metin { color: var(--metin2); font-size: 12.5px; }

  .alt { color: var(--metin2); font-size: 12.5px; text-align: center; margin: 0; }
  .alt b { color: var(--vurgu); font-weight: 600; }
  .bos-not { color: var(--metin2); font-size: 12.5px; padding: 4px 2px; }
</style>
</head>
<body>
  <main>
    <div class="marka">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="20" cy="20" r="16"/>
        <path d="M26 14l-4.2 8.2L13.6 26l4.2-8.2z" fill="currentColor" stroke="none"/>
      </svg>
      <h1>Girginos Browser<span>gizlilik odaklı tarayıcı</span></h1>
    </div>

    <form id="aramaFormu" autocomplete="off">
      <input type="text" id="sorgu" name="q" placeholder="Ara ya da adres yaz" aria-label="Arama" autofocus>
      <button type="submit">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
        <span>Ara</span>
      </button>
    </form>

    <section id="sikBolum">
      <h2>Sık gidilenler</h2>
      <div class="kutucuklar" id="kutucuklar"></div>
    </section>

    <section id="duyuruBolum" hidden>
      <h2>Öne çıkan</h2>
      <div class="duyurular" id="duyurular"></div>
    </section>

    <p class="alt" id="alt"></p>
  </main>

  <script src="newtab.js"></script>
</body>
</html>
