name: boru-hatti

# Commit → Lint → Statik → Race → Birim → Bütünleşme → CVE/SCA → Derleme →
# E2E → Duman → Yük
#
# Yerel karşılığı: `npm run boru-hatti` (scripts/boru-hatti.js). İki taraf aynı
# komutları çalıştırır; CI'da ek olarak Go ve sanal ekran (xvfb) hazır olduğu
# için yerelde atlanan kapılar burada gerçekten koşar.
#
# İMZA BURADA DEĞİL: Ed25519 yayın anahtarı depo sırrı OLARAK TUTULMUYOR.
# GitHub hesabı ele geçirilirse güncelleme zincirinin dayandığı tek anahtar da
# ele geçmiş olurdu. Manifest çevrimdışı imzalanıyor; CI yalnızca paketi üretir.
#
# Duman kapısı CANLI beslemeye bakar, bu yüzden yalnızca main'de ve etiketlerde
# çalışır: PR'larda dış ağa bağımlı kırmızı istemiyoruz.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # CVE tarafı kod değişmese de bayatlar: haftada bir kendiliğinden koşsun.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  commit:
    name: 1 · Commit (sır sızıntısı)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # sızıntı taraması git ls-files kullanıyor
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node scripts/sizinti-tara.js

  lint:
    name: 2 · Lint
    needs: commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - name: gofmt
        run: |
          farkli=$(gofmt -l sunucu/)
          if [ -n "$farkli" ]; then echo "gofmt farkı: $farkli"; gofmt -d sunucu/; exit 1; fi
          echo "gofmt temiz"

  statik:
    name: 3 · Statik analiz
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Arayüz ↔ ana süreç sözleşmesi: IPC kanalı, DOM kimliği, CSS sınıfı.
      - run: npm run kapi:statik
      - uses: actions/setup-go@v7
        # Sürümü elle yazmıyoruz: go.mod'daki yönergeden okunuyor, böylece
        # araç zinciri ile modülün beyanı bir daha ayrışamaz.
        with: { go-version-file: sunucu/go.mod }
      - run: go vet ./...
        working-directory: sunucu

  race:
    name: 4 · Race (Go)
    needs: statik
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # Sürümü elle yazmıyoruz: go.mod'daki yönergeden okunuyor, böylece
        # araç zinciri ile modülün beyanı bir daha ayrışamaz.
        with: { go-version-file: sunucu/go.mod }
      # -count=2: yarışlar tek turda her zaman görünmez.
      - run: go test -race -count=2 -timeout 300s ./...
        working-directory: sunucu

  birim:
    name: 5 · Birim testleri
    needs: statik
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  butunlesme:
    name: 6 · Bütünleşme + E2E (Electron)
    needs: birim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Electron'un başsız çalışması için sanal ekran ve sistem kütüphaneleri.
      - name: sanal ekran
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 || \
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2
      # Chromium'un SUID kum havuzu yardımcısı root'a ait ve 4755 olmalı; npm
      # paketten çıkarınca öyle gelmiyor ve Electron "sandboxsuz çalışmaktansa
      # duruyorum" deyip FATAL veriyor.
      #
      # --no-sandbox EKLEMİYORUZ. Bu tarayıcının güvenlik duruşunun tamamı
      # sandbox:true üzerine kurulu; kum havuzu kapalı koşan bir E2E takımı
      # yeşil yanar ama kullanıcının hiç çalıştırmadığı bir yapılandırmayı
      # ölçer. Kapıyı zayıflatmak yerine ortamı düzeltiyoruz.
      - name: kum havuzu izinleri
        run: |
          set +e
          yol=node_modules/electron/dist/chrome-sandbox
          if [ ! -f "$yol" ]; then
            echo "::error title=kum havuzu::$yol yok. dist: $(ls node_modules/electron/dist 2>&1 | tr '\n' ' ' | cut -c1-600)"
            exit 1
          fi
          echo "önce: $(ls -l "$yol")"
          if ! sudo chown root:root "$yol"; then
            echo "::error title=kum havuzu::chown başarısız"; exit 1
          fi
          if ! sudo chmod 4755 "$yol"; then
            echo "::error title=kum havuzu::chmod başarısız"; exit 1
          fi
          echo "sonra: $(ls -l "$yol")"
      # Ortam tanısı: kırmızıda neyin eksik olduğu günlüğe bakmadan anlaşılsın.
      - name: ortam
        run: |
          echo "çekirdek: $(uname -r)"
          echo "apparmor userns kısıtı: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo yok)"
          echo "electron ikilisi: $(node -e 'console.log(require("electron"))')"
      # Çıktı dosyaya alınıp başarısızlıkta ::error:: olarak yazdırılıyor.
      # İş günlükleri yalnızca kimlik doğrulamayla okunabiliyor; açıklamalar
      # (annotations) herkese açık API'den görülebiliyor - böylece kırmızı bir
      # koşunun sebebi dışarıdan da anlaşılır.
      - name: Electron testleri
        run: |
          set -o pipefail
          xvfb-run --auto-servernum npm run test-electron 2>&1 | tee electron.log
      # Bu adım ASLA başarısız olmamalı: tanı verisi kaybolmasın. İlk sürüm
      # grep kullanıyordu; grep eşleşme bulamayınca 1 dönüyor ve adım echo'ya
      # varmadan ölüyordu, yani hata tam da gerekli olduğu anda kayboluyordu.
      - name: başarısızlık çıktısı
        if: failure()
        continue-on-error: true
        run: |
          set +e
          # Açıklamalarda satır sonu %0A olarak kodlanıyor, % ise kaçırılmalı.
          ozet=$(tail -45 electron.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Electron kapisi::${ozet}"
          echo '----- son 120 satır -----'
          tail -120 electron.log
          exit 0

  cve:
    name: 7 · CVE / SCA
    needs: commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # npm audit + OSV (Go, go.sum'daki dolaylı bağımlılıklar dahil).
      - run: npm run kapi:cve

  yuk:
    name: 8 · Yük (engelleyici motoru)
    needs: birim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run kapi:yuk

  derleme:
    name: 9 · Derleme (Windows kurulum paketi)
    needs: [race, butunlesme, cve, yuk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dagitim/*.exe
            dagitim/*.blockmap
            dagitim/latest.yml
          if-no-files-found: error

  duman:
    name: 10 · Duman (canlı besleme)
    needs: [race, butunlesme, cve, yuk]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Yayındaki manifest, imza ve paket birbirini tutuyor mu.
      - run: npm run kapi:duman
