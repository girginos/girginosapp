name: build

# Tests run on every push; the installer is built only for version tags.
#
# We build the package here but we deliberately do NOT sign the update manifest
# in CI: if the Ed25519 release key were a repository secret, compromising the
# GitHub account would directly compromise the update key — the single point the
# whole update chain rests on. The manifest is signed offline.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Needs no Electron; finishes in seconds.
      - run: npm test

  package:
    name: windows installer
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dagitim/*.exe
            dagitim/*.blockmap
            dagitim/latest.yml
          if-no-files-found: error
